# docker-compose.yml

version: "3.9"

services:

  # ── Postgres Database ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: task_postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      # Changed from 5432:5432 to 5433:5432
      # Because Windows local Postgres is already using 5432
      # The app still connects on port 5432 INSIDE Docker network
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - task_network

  # ── Redis Cache Container ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: task_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - task_network

  # ── FastAPI App ───────────────────────────────────────────────────
  app:
    build: .
    container_name: task_api
    restart: on-failure

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./app:/code/app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - task_network

# ── Named Volumes ─────────────────────────────────────────────────────
volumes:
  postgres_data:

# ── Networks ──────────────────────────────────────────────────────────
# Explicit network so both containers can always find each other by name
networks:
  task_network:
    driver: bridge